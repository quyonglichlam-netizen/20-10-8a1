<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04030c">
<title>20/10 · Các bạn nữ 8A1 ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4eeff;--muted:#b9a9ee;--violet:#b7a2ff;--pink:#ff6fa5;--gold:#ffd34d;--line:rgba(183,162,255,.32);
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;
  background:
    radial-gradient(60% 50% at 82% 92%,rgba(24,92,80,.42),transparent 70%),
    radial-gradient(70% 60% at 14% 8%,rgba(96,60,190,.38),transparent 70%),
    radial-gradient(50% 40% at 60% 40%,rgba(255,111,165,.10),transparent 70%),
    #04030c;
}
#gal{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:0}
#gal:active{cursor:grabbing}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}

button{font-family:inherit;cursor:pointer;color:var(--ink)}
.pill{border:1px solid rgba(255,255,255,.55);background:rgba(10,8,28,.55);backdrop-filter:blur(6px);border-radius:999px;padding:9px 16px;font-size:14px}
.pill:active{transform:scale(.97)}

/* thanh trên cùng */
.top{position:fixed;z-index:9;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
#music{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:#fff;color:#111;border:0}
.tabs{position:fixed;z-index:5;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));display:flex;gap:8px;justify-content:center;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid rgba(255,255,255,.3);background:rgba(10,8,28,.55);backdrop-filter:blur(6px);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;white-space:nowrap}
.tab.on{border-color:transparent;background:linear-gradient(135deg,#7e6bff,#c96bff 60%,#ff6fa5);font-weight:600;box-shadow:0 6px 18px -6px rgba(160,110,255,.8)}
.hint{position:fixed;z-index:4;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--muted);pointer-events:none;text-shadow:0 0 10px #000}

.hidden{opacity:0!important;pointer-events:none!important}

/* ===== màn khóa: săn sao ===== */
#lock{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto;background:rgba(4,3,12,.62);backdrop-filter:blur(3px);transition:opacity 1.1s ease}
.box{margin:auto;width:min(380px,100%);text-align:center;background:rgba(14,10,38,.82);border:1px solid var(--line);border-radius:26px;padding:24px 20px 22px;box-shadow:0 30px 60px -24px rgba(120,80,255,.55)}
.box h1{font-family:"Playfair Display",serif;font-weight:800;font-size:24px;margin:2px 0 6px;line-height:1.2}
.box p{margin:0 0 12px;color:var(--muted);font-size:14.5px;line-height:1.5}
.sky{position:relative;height:210px;border-radius:18px;overflow:hidden;margin:0 0 12px;border:1px solid var(--line);
  background:radial-gradient(ellipse at 30% 20%,rgba(110,80,230,.35),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(30,120,100,.35),transparent 60%),#070518}
.star{position:absolute;margin:0;padding:0;border:0;background:none;line-height:1;color:#cfc4ff;opacity:.75;animation:drift var(--t) ease-in-out infinite alternate}
.star::before{content:"";position:absolute;inset:-12px}
@keyframes drift{to{transform:translate(var(--dx),var(--dy))}}
.star.gold{color:var(--gold);opacity:1;text-shadow:0 0 10px rgba(255,211,77,.9),0 0 22px rgba(255,170,40,.6);animation:drift var(--t) ease-in-out infinite alternate,twinkle 1.3s ease-in-out infinite}
@keyframes twinkle{50%{scale:1.25}}
.star.miss{color:#8a7fb8;opacity:.35;scale:.6;transition:all .4s;pointer-events:none}
.star.hit{animation:none;font:700 26px/1 "Be Vietnam Pro",sans-serif;color:#1a1230;background:var(--gold);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;text-shadow:none;box-shadow:0 0 18px rgba(255,211,77,.9);pointer-events:none}
.slots{display:flex;justify-content:center;gap:8px;margin:0 0 10px}
.slot{width:40px;height:46px;line-height:46px;border-radius:10px;border:1px dashed var(--violet);font-size:22px;font-weight:600;color:var(--muted)}
.slot.on{border-style:solid;background:rgba(255,211,77,.18);color:var(--gold);border-color:var(--gold)}
.count{font-size:13px;color:var(--muted);margin:0 0 10px}
input{font-family:inherit;width:100%;font-size:22px;letter-spacing:.5em;text-align:center;padding:11px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);outline:none}
input:focus{border-color:var(--violet)}
.cta{border:0;border-radius:999px;padding:12px 26px;margin-top:12px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7e6bff,#c96bff 60%,#ff6fa5);box-shadow:0 10px 24px -8px rgba(160,110,255,.8)}
.cta:active{transform:scale(.97)}
.err{min-height:20px;margin-top:8px;color:#ff9ab6;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== trang chính ===== */
#home{position:fixed;inset:0;z-index:7;overflow-y:auto;background:rgba(4,3,12,.74);backdrop-filter:blur(5px);transition:opacity 1s ease;-webkit-overflow-scrolling:touch}
.wrap{max-width:500px;margin:0 auto;padding:calc(76px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px))}
.big{margin:0;display:flex;align-items:baseline;font-family:"Playfair Display",serif;font-weight:800;font-size:clamp(96px,32vw,160px);line-height:.85;letter-spacing:-.045em;
  background:linear-gradient(160deg,#ff8db8 5%,#c96bff 55%,#7e6bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.big i{font-style:italic;font-weight:400;font-size:.86em;letter-spacing:0}
.title{margin:14px 0 0;font-size:clamp(18px,5vw,22px);font-weight:700;line-height:1.3}
.sub{margin:2px 0 0;font-family:"Dancing Script",cursive;font-weight:600;font-size:clamp(22px,6vw,27px);color:var(--pink)}
.gift{margin-top:18px}
.letter{position:relative;margin:20px 0 0;min-height:130px;padding:20px 18px 16px 30px;border-radius:6px 22px 22px 6px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s ease}
.letter.show{opacity:1;transform:none}
.letter::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1px;background:rgba(255,111,165,.5)}
.letter p{margin:0 0 11px;font-size:14.5px;line-height:1.7}
#l1{font:700 30px/1.15 "Dancing Script",cursive;color:var(--pink)}
#l2{font:italic 400 18px/1.55 "Playfair Display",serif;color:#e4d9ff}
#l5{font:700 23px/1.3 "Dancing Script",cursive;color:var(--gold);text-align:right;margin:6px 0 0}
#ans{display:none;margin-top:4px}
@media (prefers-reduced-motion:reduce){.star,.star.gold{animation:none}}
</style>
</head>
<body>
<canvas id="gal"></canvas>
<div class="vig"></div>

<div class="top">
  <button id="back" class="pill hidden">Về trang chính</button>
  <button id="music" class="hidden" aria-label="Bật/tắt nhạc">♪</button>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="hint">Kéo để xoay · chạm vào lời chúc để làm nó sáng lên</div>

<section id="lock">
  <div class="box" id="lockbox">
    <h1>Món quà cho các nữ sinh 8A1</h1>
    <p>Trên bầu trời có 4 ngôi sao vàng đang lấp lánh. Chạm vào từng ngôi sao để lấy con số của nó.</p>
    <div class="sky" id="sky"></div>
    <div class="slots" id="slots"></div>
    <p class="count" id="count">Đã thu thập 0/4 sao vàng</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <div class="err" id="err"></div>
    <button id="go" class="cta">Mở khóa</button>
  </div>
</section>

<section id="home" class="hidden">
  <div class="wrap">
    <h2 class="big" aria-label="Ngày 20 tháng 10"><span>20</span><i>/</i><span>10</span></h2>
    <p class="title">Gửi các bạn nữ lớp 8A1</p>
    <p class="sub">Mỗi cậu là một vì sao riêng</p>
    <button id="open" class="cta gift">🎁 Mở quà</button>
    <article class="letter" id="letter">
      <p id="l1"></p><p id="l2"></p><p id="l3"></p><p id="l4"></p>
      <p id="l5"></p>
    </article>
    <div id="ans"><button id="enter" class="cta">Bay vào dải ngân hà ✨</button></div>
  </div>
</section>

<script>
(function(){
  // ====== Tùy chỉnh tại đây ======
  var PASSWORD="2010";
  var LINES=[
    "Gửi các bạn nữ lớp 8A1,",
    "Nhân ngày 20/10, chúc các cậu luôn xinh tươi, tự tin và rạng rỡ như những vì sao trên bầu trời đêm.",
    "Cảm ơn các cậu vì những tiếng cười, những buổi học vui và rất nhiều kỷ niệm của lớp mình.",
    "Chúc cả hội học thật giỏi, khỏe mạnh và mọi ước mơ đều thành hiện thực.",
    "Chúc 8A1 một ngày 20/10 thật rực rỡ ✨"
  ];
  var TABS=[
    {id:"chung",label:"🌟 Chung",words:["Chúc mừng 20/10","8A1 girl power","Xinh đẹp mỗi ngày","Yêu cả hội nhiều lắm","Nữ sinh 8A1 tỏa sáng","Cười thật tươi nhé","Hội chị em 8A1","Rạng rỡ như sao","Công chúa của lớp","Hôm nay là ngày của tụi mình","Luôn là phiên bản đẹp nhất"]},
    {id:"hoc",label:"📚 Học tập",words:["Điểm 10 nhiều nhiều","Học ít hiểu nhiều","Thi đâu đỗ đó","Không bị gọi lên bảng","Bài khó cũng dễ","Giỏi toàn diện","Quên bài? Không có!","Kiểm tra toàn điểm cao","Sổ liên lạc toàn lời khen","Chăm chỉ có quả ngọt"]},
    {id:"ban",label:"💞 Tình bạn",words:["Bạn bè là nhất","Có nhau là vui","Cùng nhau lớn lên","Chung nhóm mãi nhé","Thân nhau thật lâu","Kỷ niệm 8A1","Cả hội bên nhau","Giận nhau rồi lại làm hòa","Tụi mình mãi là bạn","Thương hội bạn nhiều"]},
    {id:"mo",label:"🚀 Ước mơ",words:["Ước gì được nấy","Bay thật cao","Tương lai rực rỡ","Mơ lớn, làm giỏi","Tự tin tỏa sáng","Mỗi ngày một vui","Cứ thế mà tiến lên","Trở thành người mình muốn","Gặp toàn điều may mắn","Thanh xuân thật rực rỡ"]}
  ];
  // ===============================
  var $=function(i){return document.getElementById(i)};
  var rnd=Math.random,reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Săn sao để lấy mật khẩu ---------- */
  (function(){
    var code=PASSWORD.split(""),N=24,found=0,sky=$("sky"),sl=$("slots"),special=[];
    while(special.length<code.length){var r=Math.floor(rnd()*N);if(special.indexOf(r)<0)special.push(r)}
    code.forEach(function(){var d=document.createElement("div");d.className="slot";d.textContent="?";sl.appendChild(d)});
    for(var i=0;i<N;i++)(function(i){
      var k=special.indexOf(i),gold=k>=0,b=document.createElement("button");
      b.className="star"+(gold?" gold":"");b.textContent=gold?"★":"✦";
      b.setAttribute("aria-label",gold?"Sao vàng":"Sao thường");
      b.style.cssText="left:"+(4+rnd()*88)+"%;top:"+(6+rnd()*80)+"%;font-size:"+(gold?24:12+rnd()*8)+"px;--t:"+(5+rnd()*6)+"s;--dx:"+((rnd()-.5)*50)+"px;--dy:"+((rnd()-.5)*40)+"px;animation-delay:-"+(rnd()*5)+"s";
      b.onclick=function(){
        if(gold){
          b.classList.add("hit");b.textContent=code[k];
          var s=sl.children[k];s.textContent=code[k];s.classList.add("on");
          found++;$("count").textContent="Đã thu thập "+found+"/"+code.length+" sao vàng";
          $("err").textContent=found===code.length?"Đủ 4 số rồi! Nhập vào ô bên dưới nhé 🔑":"";
        }else{
          b.classList.add("miss");$("err").textContent="Sao thường thôi, tìm sao vàng nhé ✨";
        }
      };
      sky.appendChild(b);
    })(i);
  })();

  /* ---------- Mở khóa ---------- */
  function unlock(){
    if($("pw").value.trim()===PASSWORD){
      $("lock").classList.add("hidden");
      setTimeout(function(){$("lock").style.display="none"},1100);
      $("home").classList.remove("hidden");
      $("music").classList.remove("hidden");
      play();
    }else{
      $("err").textContent="Chưa đúng rồi, thử lại nhé 💭";
      var b=$("lockbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
      $("pw").value="";
    }
  }
  $("go").onclick=unlock;
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});

  /* ---------- Nhạc nền (dữ liệu ở cuối file: window.AUDIO_DATA) ---------- */
  var au=null;
  function audio(){if(!au){au=new Audio(window.AUDIO_DATA);au.loop=true}return au}
  function play(){
    var a=audio();a.currentTime=0;
    var r=a.play();
    if(r&&r.catch)r.catch(function(){$("music").textContent="🔇"});
    $("music").textContent="♪";
  }
  $("music").onclick=function(){
    var a=audio();
    if(a.paused){a.play();$("music").textContent="♪"}
    else{a.pause();$("music").textContent="🔇"}
  };

  /* ---------- Trang chính: mở quà, gõ thư ---------- */
  var opened=false,done=false;
  function follow(){var h=$("home");h.scrollTo({top:h.scrollHeight,behavior:"smooth"})}
  $("open").onclick=function(){
    if(opened)return;opened=true;
    $("open").style.display="none";
    $("letter").classList.add("show");
    var idx=0;
    (function next(){
      if(idx>=LINES.length){done=true;$("ans").style.display="block";follow();return}
      var el=$("l"+(idx+1)),txt=LINES[idx],c=0;
      (function type(){
        el.textContent=txt.slice(0,++c);
        if(c%24===0)follow();
        if(c<txt.length)setTimeout(type,28);
        else{idx++;setTimeout(next,350)}
      })();
    })();
  };
  $("enter").onclick=function(){$("home").classList.add("hidden");$("back").classList.remove("hidden")};
  $("back").onclick=function(){
    $("home").classList.remove("hidden");$("back").classList.add("hidden");
  };

  /* ---------- Dải ngân hà lời chúc (canvas 3D) ---------- */
  var cv=$("gal"),ctx=cv.getContext("2d"),W=0,H=0,dpr=1;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize",resize);resize();

  var FONT='"Be Vietnam Pro","Segoe UI",Arial,sans-serif';
  var yaw=0,pitch=.1,vy=0,vp=0,drag=false,cur=0,items=[],stickers=[],stars=[],proj=[];
  var EMO=["⭐","💖","🌷","🦋","✨","🌸","🌟","🎀"];

  function sph(rmin,rmax,flat){
    var th=rnd()*6.2832,ph=Math.acos(2*rnd()-1),r=rmin+rnd()*(rmax-rmin);
    return {x:r*Math.sin(ph)*Math.cos(th),y:r*Math.cos(ph)*(flat||1),z:r*Math.sin(ph)*Math.sin(th)};
  }
  // Lời chúc nằm trên các "bức tường" bao quanh người xem, chữ nghiêng theo phối cảnh
  function build(){
    items=[];var w=TABS[cur].words,total=170,now=performance.now();
    ctx.font="600 100px "+FONT;
    var wid=w.map(function(t){return ctx.measureText(t).width});
    for(var n=0;n<total;n++){
      var ix=n%w.length,th=rnd()*6.2832,r=430+Math.pow(rnd(),1.4)*850,dx=Math.cos(th),dz=Math.sin(th);
      items.push({t:w[ix],w100:wid[ix],x:r*dx,y:(rnd()-.5)*880,z:r*dz,rx:dz,rz:-dx,
        k:1.0+rnd()*1.9,v:rnd()<.55,a:(rnd()-.5)*.4,born:now+rnd()*800,pulse:0});
    }
  }
  for(var i=0;i<26;i++){var p=sph(420,1000,.8);stickers.push({t:EMO[i%EMO.length],x:p.x,y:p.y,z:p.z,s:.9+rnd()*.9,sticker:1,pulse:0})}
  for(var j=0;j<460;j++){var q=sph(1500,1500);q.a=rnd()*6;q.r=rnd()<.12?2:1;stars.push(q)}

  function tabsUI(){
    var nav=$("tabs");
    TABS.forEach(function(t,i){
      var b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.textContent=t.label;
      b.onclick=function(){cur=i;[].forEach.call(nav.children,function(x,k){x.classList.toggle("on",k===i)});build()};
      nav.appendChild(b);
    });
  }
  tabsUI();build();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(build);

  var cy=1,sy=0,cp=1,sp=0;
  function rv(x,y,z){
    var x1=x*cy-z*sy,z1=x*sy+z*cy;
    return [x1,y*cp-z1*sp,y*sp+z1*cp];
  }
  var F=0;
  function frame(t){
    F=Math.min(W,H)*1.05;
    ctx.clearRect(0,0,W,H);
    if(!drag){yaw+=vy;pitch+=vp;vy*=.95;vp*=.95;if(!reduce)yaw+=.0009}
    pitch=Math.max(-1.1,Math.min(1.1,pitch));
    cy=Math.cos(yaw);sy=Math.sin(yaw);cp=Math.cos(pitch);sp=Math.sin(pitch);
    var Dn=rv(0,1,0);

    for(var i=0;i<stars.length;i++){
      var s=stars[i],r=rv(s.x,s.y,s.z);
      if(r[2]<50)continue;
      var k=F/r[2],px=W/2+r[0]*k,py=H/2+r[1]*k;
      if(px<0||px>W||py<0||py>H)continue;
      ctx.globalAlpha=.45+.45*Math.sin(t*.002+s.a);ctx.fillStyle="#fff";
      ctx.fillRect(px,py,s.r,s.r);
    }

    proj.length=0;
    var n,o,it;
    for(n=0;n<items.length;n++){
      it=items[n];
      var c=rv(it.x,it.y,it.z);
      if(c[2]<110)continue;
      var sc=F/c[2],sx0=W/2+c[0]*sc,sy0=H/2+c[1]*sc;
      if(sx0<-420||sx0>W+420||sy0<-160||sy0>H+160)continue;
      var Rv=rv(it.rx,0,it.rz),ca=Math.cos(it.a),sa=Math.sin(it.a),kk=it.k;
      var Rx=Rv[0]*ca+Dn[0]*sa,Ry=Rv[1]*ca+Dn[1]*sa,Rz=Rv[2]*ca+Dn[2]*sa;
      var Dx=Dn[0]*ca-Rv[0]*sa,Dy=Dn[1]*ca-Rv[1]*sa,Dz=Dn[2]*ca-Rv[2]*sa;
      var z1=c[2]+Rz*kk,z2=c[2]+Dz*kk;
      if(z1<20||z2<20)continue;
      var m=[(W/2+(c[0]+Rx*kk)*F/z1)-sx0,(H/2+(c[1]+Ry*kk)*F/z1)-sy0,
             (W/2+(c[0]+Dx*kk)*F/z2)-sx0,(H/2+(c[1]+Dy*kk)*F/z2)-sy0,sx0,sy0];
      proj.push({it:it,z:c[2],m:m,x:sx0,y:sy0,sc:sc});
    }
    for(n=0;n<stickers.length;n++){
      it=stickers[n];
      var c2=rv(it.x,it.y,it.z);
      if(c2[2]<110)continue;
      var sc2=F/c2[2],px2=W/2+c2[0]*sc2,py2=H/2+c2[1]*sc2;
      if(px2<-80||px2>W+80||py2<-80||py2>H+80)continue;
      proj.push({it:it,z:c2[2],x:px2,y:py2,sc:sc2});
